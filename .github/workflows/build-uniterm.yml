name: Build uniTerm Windows x64 Portable

on:
  workflow_dispatch:

  schedule:
    # Every day at 19:00 UTC = 03:00 Beijing time
    - cron: "0 19 * * *"

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/ys-ll/uniTerm.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    name: Build Windows x64 Portable
    runs-on: windows-latest

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Clone latest uniTerm
        shell: pwsh
        run: |
          git clone `
            --depth 1 `
            --branch $env:UPSTREAM_BRANCH `
            $env:UPSTREAM_REPO `
            uniterm

          Set-Location uniterm

          $commit = git rev-parse HEAD
          $shortCommit = git rev-parse --short HEAD

          "UNITERM_COMMIT=$commit" >> $env:GITHUB_ENV
          "UNITERM_SHORT_COMMIT=$shortCommit" >> $env:GITHUB_ENV

          Write-Host "========================================"
          Write-Host "uniTerm commit:"
          Write-Host $commit
          Write-Host "========================================"

      - name: Read uniTerm build requirements
        shell: pwsh
        working-directory: uniterm
        run: |
          Write-Host "go.mod:"
          Get-Content go.mod | Select-String "^go |wails/v3"

          Write-Host ""
          Write-Host "Frontend package manager:"
          Get-Content frontend/package.json | Select-String '"packageManager"|"build"'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: uniterm/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uniterm/frontend/package-lock.json

      - name: Install Wails3 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

          $goBin = go env GOPATH
          "$goBin\bin" >> $env:GITHUB_PATH

          Write-Host ""
          Write-Host "Wails CLI:"
          wails3 version

      - name: Generate uniTerm build assets
        shell: pwsh
        working-directory: uniterm
        run: |
          Write-Host "Updating Wails build assets..."

          wails3 task common:update:build-assets

          Write-Host ""
          Write-Host "Generated Windows build files:"
          Get-ChildItem build\windows

      - name: Verify generated Windows assets
        shell: pwsh
        working-directory: uniterm
        run: |
          $requiredFiles = @(
            "build\windows\icon.ico",
            "build\windows\info.json",
            "build\windows\wails.exe.manifest"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "Required build asset is missing: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

      - name: Build uniTerm
        shell: pwsh
        working-directory: uniterm
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          Write-Host "Building uniTerm..."

          wails3 build `
            GOOS=windows `
            ARCH=amd64 `
            CGO_ENABLED=0 `
            VERSION=$env:UNITERM_SHORT_COMMIT

      - name: Verify executable
        shell: pwsh
        working-directory: uniterm
        run: |
          $exe = "bin\uniTerm.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Build failed: $exe does not exist."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESS"
          Write-Host "========================================"
          Write-Host "Executable : $($file.FullName)"
          Write-Host "Size       : $([math]::Round($file.Length / 1MB, 2)) MB"
          Write-Host "Commit     : $env:UNITERM_COMMIT"
          Write-Host "Version    : $env:UNITERM_SHORT_COMMIT"
          Write-Host "========================================"

      - name: Prepare portable package
        shell: pwsh
        run: |
          $packageName = "uniTerm-windows-amd64-portable"
          $packageDir = "dist\$packageName"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packageDir | Out-Null

          Copy-Item `
            "uniterm\bin\uniTerm.exe" `
            "$packageDir\uniTerm.exe"

          @"
          uniTerm Windows x64 Portable

          Upstream repository:
          https://github.com/ys-ll/uniTerm

          Upstream branch:
          main

          Upstream commit:
          $env:UNITERM_COMMIT

          Short commit:
          $env:UNITERM_SHORT_COMMIT

          Build date:
          $(Get-Date -Format "yyyy-MM-dd HH:mm:ss 'UTC'")

          Architecture:
          Windows x64 / amd64

          CGO:
          disabled
          "@ | Set-Content `
            "$packageDir\BUILD_INFO.txt" `
            -Encoding UTF8

          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath "dist\$packageName.zip" `
            -CompressionLevel Optimal

      - name: Generate SHA256
        shell: pwsh
        run: |
          $file = "dist\uniTerm-windows-amd64-portable.zip"

          $hash = (Get-FileHash `
            $file `
            -Algorithm SHA256).Hash

          "$hash  uniTerm-windows-amd64-portable.zip" |
            Set-Content `
            "dist\uniTerm-windows-amd64-portable.zip.sha256" `
            -Encoding ASCII

          Write-Host "SHA256:"
          Write-Host $hash

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniTerm-windows-amd64-portable
          path: |
            dist/uniTerm-windows-amd64-portable.zip
            dist/uniTerm-windows-amd64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.UNITERM_SHORT_COMMIT }}"
          name: "uniTerm Windows Portable - ${{ env.UNITERM_SHORT_COMMIT }}"
          prerelease: true
          generate_release_notes: false
          files: |
            dist/uniTerm-windows-amd64-portable.zip
            dist/uniTerm-windows-amd64-portable.zip.sha256
          body: |
            Automated Windows x64 portable build of uniTerm.

            Upstream:
            https://github.com/ys-ll/uniTerm

            Commit:
            ${{ env.UNITERM_COMMIT }}

            Architecture:
            Windows amd64

            CGO:
            disabled

            This package was built automatically from the upstream main branch.
